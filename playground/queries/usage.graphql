# Hourly electricity import and export for one day.
#
# Variables (accountNumber is filled in automatically from .env):
# {
#   "startAt": "2026-11-12T00:00:00Z",
#   "endAt": "2026-11-13T00:00:00Z"
# }

query Usage($accountNumber: String!, $startAt: DateTime!, $endAt: DateTime!) {
  account(accountNumber: $accountNumber) {
    properties {
      id
      import: measurements(
        startAt: $startAt
        endAt: $endAt
        timezone: "Europe/London"
        first: 24
        utilityFilters: [{
          electricityFilters: {
            readingFrequencyType: HOUR_INTERVAL
            readingDirection: CONSUMPTION
          }
        }]
      ) {
        totalCount
        edges {
          node {
            value
            unit
            ... on IntervalMeasurementType {
              startAt
              endAt
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
      export: measurements(
        startAt: $startAt
        endAt: $endAt
        timezone: "Europe/London"
        first: 24
        utilityFilters: [{
          electricityFilters: {
            readingFrequencyType: HOUR_INTERVAL
            readingDirection: GENERATION
          }
        }]
      ) {
        totalCount
        edges {
          node {
            value
            unit
            ... on IntervalMeasurementType {
              startAt
              endAt
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
